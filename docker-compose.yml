# Attestation roots (server/secrets/attestation_roots.pem) and revoked serials
# (attestation_revoked.txt) are operator supplied and start empty: no real attestation is accepted
# until the operator fills them.
# LAB stack. The signing key is a Docker secret (file server/secrets/server_signing_key.hex,
# 64 hex chars, gitignored). `migrate` runs once with the Postgres admin role, which creates the
# non-superuser schema owner `meshpay_owner` (owns the schema and SECURITY DEFINER functions).
# `server` only gets the least-privilege runtime role `meshpay_app`.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ./server
    image: meshpay-server
    command: ["meshpay_server", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATOR_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD}
      SUPPLY_CAP_UNITS: ${SUPPLY_CAP_UNITS}
      INITIAL_GRANT_UNITS: ${INITIAL_GRANT_UNITS}

  server:
    build:
      context: ./server
    image: meshpay-server
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - server_signing_key
      - server_key_cert
      - server_snapshot_key
      - server_snapshot_key_cert
      - attestation_roots
      - attestation_revoked
    environment:
      DATABASE_URL: postgres://meshpay_app:${RUNTIME_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LISTEN_ADDR: 0.0.0.0:${SERVER_PORT}
      LAB_MODE: ${LAB_MODE}
      SERVER_SIGNING_KEY_FILE: ${SERVER_SIGNING_KEY_FILE}
      SERVER_KEY_CERT_FILE: ${SERVER_KEY_CERT_FILE}
      SERVER_ROOT_PUBLIC_KEY_HEX: ${SERVER_ROOT_PUBLIC_KEY_HEX}
      SERVER_SNAPSHOT_KEY_FILE: ${SERVER_SNAPSHOT_KEY_FILE}
      SERVER_SNAPSHOT_KEY_CERT_FILE: ${SERVER_SNAPSHOT_KEY_CERT_FILE}
      CAP_CHEQUE_UNITS: ${CAP_CHEQUE_UNITS}
      CAP_RESERVE_UNITS: ${CAP_RESERVE_UNITS}
      CHEQUE_MAX_COUNT: ${CHEQUE_MAX_COUNT}
      CHEQUE_TTL_MAX_SECONDS: ${CHEQUE_TTL_MAX_SECONDS}
      BALANCE_AUTH_WINDOW_SECONDS: ${BALANCE_AUTH_WINDOW_SECONDS}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS}
      REGISTER_LIMIT_PER_MINUTE: ${REGISTER_LIMIT_PER_MINUTE}
      CHALLENGE_LIMIT_PER_MINUTE: ${CHALLENGE_LIMIT_PER_MINUTE}
      CONTROL_LIMIT_PER_MINUTE: ${CONTROL_LIMIT_PER_MINUTE}
      PUBLIC_READ_LIMIT_PER_MINUTE: ${PUBLIC_READ_LIMIT_PER_MINUTE}
      ATTESTATION_ROOTS_PEM_FILE: ${ATTESTATION_ROOTS_PEM_FILE}
      ATTESTATION_REVOCATION_FILE: ${ATTESTATION_REVOCATION_FILE}
      ATTESTATION_CHALLENGE_TTL_SECONDS: ${ATTESTATION_CHALLENGE_TTL_SECONDS}
      ALLOW_TEE_ISSUANCE: ${ALLOW_TEE_ISSUANCE}
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT}:${SERVER_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${SERVER_PORT}/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

secrets:
  server_signing_key:
    file: ./server/secrets/server_signing_key.hex
  server_key_cert:
    file: ./server/secrets/server_key_cert.hex
  server_snapshot_key:
    file: ./server/secrets/server_snapshot_key.hex
  server_snapshot_key_cert:
    file: ./server/secrets/server_snapshot_key_cert.hex
  attestation_roots:
    file: ./server/secrets/attestation_roots.pem
  attestation_revoked:
    file: ./server/secrets/attestation_revoked.txt

volumes:
  pgdata:
