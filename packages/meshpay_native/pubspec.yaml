name: meshpay_native
description: Android native BLE and L2CAP support for MeshPay.
version: 0.0.1

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: company.barbatech.meshpay_native
        pluginClass: MeshpayNativePlugin
