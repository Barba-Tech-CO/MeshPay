publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  design_system:
    path: ../packages/design_system

  dio: ^5.11.1
  fixnum: ^1.1.1
  flutter:
