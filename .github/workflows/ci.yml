name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Rust project
        id: detect
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          toolchain: stable
      - name: Check Rust formatting
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: cargo fmt --check
      - name: Run Rust Clippy
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: cargo clippy --locked -- -D warnings
      - name: Run Rust tests
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: cargo test --locked

  # Study prototypes: fmt, clippy and tests only; excluded from cargo audit/deny gates (blind_signatures uses an rc crate with a known RUSTSEC advisory).
  tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - tools/risk_sim
          - tools/social_recovery
          - tools/blind_signatures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Rust project
        id: detect
        run: |
          if [ -f "${{ matrix.crate }}/Cargo.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache-workspaces: ${{ matrix.crate }}
      - name: Check Rust formatting
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --check
      - name: Run Rust Clippy
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Flutter projects
        id: detect
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "app_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f packages/design_system/pubspec.yaml ]; then
            echo "design_system_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "design_system_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f packages/meshpay_native/pubspec.yaml ]; then
            echo "meshpay_native_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "meshpay_native_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f app/pubspec.yaml ] || [ -f packages/design_system/pubspec.yaml ] || [ -f packages/meshpay_native/pubspec.yaml ]; then
            echo "any_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.detect.outputs.any_present == 'true'
        with:
          channel: stable
          flutter-version: 3.47.9
      - name: Analyze app
        if: steps.detect.outputs.app_present == 'true'
        working-directory: app
        run: flutter analyze
      - name: Test app
        if: steps.detect.outputs.app_present == 'true'
        working-directory: app
        run: flutter test
      - name: Analyze design system
        if: steps.detect.outputs.design_system_present == 'true'
        working-directory: packages/design_system
        run: flutter analyze
      - name: Test design system
        if: steps.detect.outputs.design_system_present == 'true'
        working-directory: packages/design_system
        run: flutter test
      - name: Analyze native plugin
        if: steps.detect.outputs.meshpay_native_present == 'true'
        working-directory: packages/meshpay_native
        run: flutter analyze
      - name: Test native plugin
        if: steps.detect.outputs.meshpay_native_present == 'true'
        working-directory: packages/meshpay_native
        run: flutter test

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: meshpay
          POSTGRES_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_DB: meshpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meshpay -d meshpay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    # CI-only throwaway values for the service container above, not secrets (hex-only, as the server requires).
    env:
      MIGRATOR_DATABASE_URL: postgres://meshpay:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@127.0.0.1:5432/meshpay
      RUNTIME_DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DATABASE_URL: postgres://meshpay_app:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@127.0.0.1:5432/meshpay
      INITIAL_GRANT_UNITS: "10000"
      SUPPLY_CAP_UNITS: "1000000000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache-workspaces: server
      - name: Check server formatting
        working-directory: server
        run: cargo fmt --check
      - name: Run server Clippy
        working-directory: server
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run server tests against Postgres
        working-directory: server
        run: cargo test --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/server-test.log"
        shell: bash
      - name: Fail if any server test was skipped
        run: |
          if grep -q 'SKIPPED' "$RUNNER_TEMP/server-test.log"; then
            echo "::error::server tests were skipped; the database env is incomplete"
            exit 1
          fi
