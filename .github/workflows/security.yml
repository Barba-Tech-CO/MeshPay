name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Rust project
        id: detect
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          toolchain: stable
      - name: Install Rust security tools
        if: steps.detect.outputs.present == 'true'
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Run cargo audit
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: cargo audit
      - name: Check Rust dependency policy
        if: steps.detect.outputs.present == 'true'
        working-directory: core
        run: |
          cargo deny --config ../deny.toml check advisories
          cargo deny --config ../deny.toml check licenses
          cargo deny --config ../deny.toml check sources
          cargo deny --config ../deny.toml check bans

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect lockfiles
        id: detect
        run: |
          present=false
          scan_args="--config=./osv-scanner.toml"
          for lockfile in \
            app/pubspec.lock \
            packages/design_system/pubspec.lock \
            packages/meshpay_native/pubspec.lock \
            app/android/app/gradle.lockfile; do
            if [ -f "$lockfile" ]; then
              present=true
              scan_args="$(printf '%s\n-L\n%s' "$scan_args" "$lockfile")"
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          {
            echo "scan_args<<EOF"
            printf '%s\n' "$scan_args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Scan lockfiles with OSV-Scanner
        if: steps.detect.outputs.present == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: ${{ steps.detect.outputs.scan_args }}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: gitleaks git --config .gitleaks.toml --redact
