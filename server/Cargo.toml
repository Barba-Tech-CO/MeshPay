[package]
name = "meshpay_server"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# LAB ONLY tools (`lab-key-cert`); enabled by the compose lab image build.
lab = []

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
p256 = { version = "0.14.0", features = ["pkcs8"] }
pbkdf2 = "0.13.0"
prost = "0.14.4"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5.3", features = ["timeout", "limit", "util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
time = "0.3.55"
